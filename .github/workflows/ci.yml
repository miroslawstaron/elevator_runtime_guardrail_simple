name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4.2.0
      with:
        fetch-depth: 1

    - name: Check guardrails integrity
      run: make check-guardrails

    # DOCUMENTATION CHECK: Require the stage registry, rendered diagrams and web mirrors to agree
    - name: Verify evolution diagrams and published web assets
      run: node tools/check-evolution.mjs

    - name: Build project
      run: make all

    - name: Run tests
      run: make test

    # HTTP VERIFICATION: Start compiled services in isolated tests on both supported CI platforms
    - name: Test C HTTP server
      run: node tests/test_web.mjs ./elevator_web${{ runner.os == 'Windows' && '.exe' || '' }}

    # PERSISTENCE VERIFICATION: Confirm experiment history and passenger feedback survive service restarts
    - name: Test persistent telemetry and passenger feedback
      run: node tests/test_telemetry_web.mjs ./elevator_web${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.4.0
      if: always()
      with:
        name: build-${{ matrix.os }}
        path: |
          elevator_guardrails
          elevator_guardrails.exe
          test_simple
          test_simple.exe
          elevator_web
          elevator_web.exe
          web/
